<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приглашение на Свадьбу</title>
    <link rel="stylesheet" href="/styles/styles.css">
</head>
<body>
    <div class="content">
        <div class="hero" style="background-image: url(../images/5fa5bb0f31fe683e96e17e9f7ca155f46ad007fe.jpg);">
            <h1 class="hero__title">Никита <span class="conjunction">и </span><span style="display: block; text-align: right;">Екатерина</span></h1>
            <div class="hero__content">
                <h2 class="hero__date">24.04.2026</h2>
                <h3 class="hero__subtitle">До свадьбы осталось:</h3>
                <div class="counter">
                    <div class="counter__item">
                        <div class="counter__item-number" id="days">42</div>
                        <div class="counter__item-text counter__item-days">дня</div>
                    </div>
                    <div class="counter__item">
                        <div class="counter__item-number" id="hours">42</div>
                        <div class="counter__item-text counter__item-hours">часов</div>
                    </div>
                    <div class="counter__item">
                        <div class="counter__item-number" id="minutes">42</div>
                        <div class="counter__item-text counter__item-minutes">минут</div>
                    </div>
                    <div class="counter__item">
                        <div class="counter__item-number" id="seconds">42</div>
                        <div class="counter__item-text counter__item-seconds">секунд</div>
                    </div>
                </div>
            </div>
            <div class="hero__overlay"></div>
        </div>
    </div>
    <script src="/scripts/script.js"></script>
</body>
</html>
